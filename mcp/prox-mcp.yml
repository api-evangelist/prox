source: https://useprox.com/docs/mcp
server:
  name: prox
  description: Prox's hosted Model Context Protocol connector. Lets ChatGPT, Claude, Copilot, and Gemini
    query a manufacturer's Prox workspace — products, knowledge trees, and wiki nodes grounded in the
    company's manuals and catalogs — and make attributed edits, all scoped to the signed-in user's workspace
    permissions.
  transport: http
  url: https://mcp.useprox.com/mcp
authentication:
  type: oauth2
  profile: OAuth 2.1 with PKCE (S256) and dynamic client registration
  identity_provider: WorkOS AuthKit
  authorization_server: https://signin.useprox.com
  resource: https://mcp.useprox.com
  bearer_methods:
  - header
  scopes:
  - openid
  - profile
  - email
  - offline_access
  notes: No API keys. The client authenticates the end user on their behalf; access is scoped to the user's
    Prox workspace and respects existing account permissions without privilege escalation. All changes
    are attributed to the user's identity and recorded in version history.
tools:
- name: list_products
  description: Use first to discover the products available in this Prox tenant. Returns product IDs,
    SKUs, summaries, thumbnails, URLs, and knowledge-node counts without changing anything.
  access: read-only
- name: get_product_tree
  description: Use after list_products to inspect one product's knowledge hierarchy. Returns every node
    ID and parent/child relationship so a model can choose which nodes to read next.
  access: read-only
- name: read_wiki_nodes
  description: Read up to 10 selected product knowledge nodes. Returns markdown content, exact editable_content
    for safe text replacements, and public media URLs. Call this before edit_wiki_node.
  access: read-only
- name: edit_wiki_node
  description: Apply a small exact old_text to new_text replacement to one wiki node body, then commit
    the change to the product Git repo. Use only after read_wiki_nodes provides the exact editable_content.
  access: write
clients:
- name: Claude.ai (web/mobile)
  setup: Settings -> Connectors -> Add custom connector -> paste server URL -> authenticate via signin.useprox.com
- name: Claude Desktop
  setup: Settings -> Connectors -> Add custom connector -> enter URL -> sign in
- name: Claude Code
  setup: Add the server via CLI, then run /mcp to authenticate
- name: ChatGPT
- name: Microsoft Copilot
- name: Google Gemini
