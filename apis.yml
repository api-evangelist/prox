aid: prox
name: Prox
description: >-
  Prox is the AI product specialist for manufacturers of complex physical products.
  It grounds answers in a company's own manuals and catalogs, cites them to the page,
  and deploys everywhere customers, dealers, and field technicians already work,
  including a hosted Model Context Protocol (MCP) connector for ChatGPT, Claude,
  Copilot, and Gemini. Prox indexes internal technical knowledge and generates visual
  answers such as troubleshooters, product selectors, sizing calculators, and
  step-by-step guides. Backed by Y Combinator (F25), Bloomberg Beta, and investors
  from OpenAI and Microsoft, and based in San Francisco.
